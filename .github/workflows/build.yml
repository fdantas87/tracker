name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Só o que vai para produção: ferramenta de build (devDependencies) não
      # barra o deploy. Vulnerabilidade alta ou crítica em runtime, barra.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
